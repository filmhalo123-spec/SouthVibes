<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">เข้าสู่ระบบ | SouthVibes</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Merriweather', serif; }

        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px rgba(255,255,255,0.15) inset !important;
            -webkit-text-fill-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* Toast notification */
        #toast {
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        #toast.hide {
            opacity: 0;
            transform: translateY(20px);
        }
    </style>
</head>
<body class="min-h-screen bg-gray-900 selection:bg-blue-300 selection:text-blue-900">

    <div id="toast" class="hide fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl text-sm font-medium text-white backdrop-blur-xl border border-white/20 min-w-[260px] max-w-sm">
        <i id="toastIcon" data-lucide="check-circle" class="h-5 w-5 shrink-0"></i>
        <span id="toastMsg"></span>
    </div>

    <div class="absolute top-6 right-6 z-50 flex items-center gap-2 text-sm font-bold text-white/60 bg-black/30 px-4 py-2 rounded-full backdrop-blur-md border border-white/10 shadow-lg">
        <i data-lucide="globe" class="h-4 w-4 text-white"></i>
        <button id="btn-th" class="hover:text-white transition-colors">TH</button>
        <span class="text-white/30">/</span>
        <button id="btn-en" class="hover:text-white transition-colors">EN</button>
    </div>

    <div class="relative min-h-screen flex items-center justify-center p-4">
        
        <div class="absolute inset-0 w-full h-full overflow-hidden">
            <img src="https://www.expedia.co.th/stories/wp-content/uploads/2022/07/1.%E0%B9%80%E0%B8%81%E0%B8%B2%E0%B8%B0%E0%B8%95%E0%B8%B2%E0%B8%8A%E0%B8%B1%E0%B8%A2-1.jpg" 
                 alt="Beautiful Andaman Sea Background" 
                 class="w-full h-full object-cover transform scale-105" />
            <div class="absolute inset-0 bg-gray-900/40"></div>
        </div>

        <div class="relative z-10 w-full max-w-md">

            <div class="flex justify-between items-center mb-8">
                <a href="index.html" class="flex items-center gap-2 text-white/80 hover:text-white transition-colors cursor-pointer group">
                    <i data-lucide="arrow-left" class="h-5 w-5 group-hover:-translate-x-1 transition-transform"></i>
                    <span class="text-sm font-medium" data-i18n="back">กลับสู่หน้าหลัก</span>
                </a>
                <div class="flex items-center gap-2">
                    <div class="bg-blue-600 text-white p-1.5 rounded-full">
                        <i data-lucide="compass" class="h-5 w-5"></i>
                    </div>
                    <span class="font-serif font-bold text-xl tracking-tight text-white">
                        South<span class="text-blue-400">Vibes</span>
                    </span>
                </div>
            </div>

            <div class="bg-white/10 backdrop-blur-xl border border-white/20 p-8 sm:p-10 rounded-3xl shadow-2xl">
                
                <h1 class="text-3xl font-serif font-bold text-white mb-2" data-i18n="title">ยินดีต้อนรับกลับมา</h1>
                <p class="text-white/70 text-sm mb-8" data-i18n="subtitle">เข้าสู่ระบบเพื่อเริ่มวางแผนและแบ่งปันการเดินทางของคุณ</p>

                <form id="loginForm" class="space-y-5">

                    <div>
                        <label for="email" class="block text-sm font-medium text-white/90 mb-1.5" data-i18n="emailLabel">อีเมล</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-lucide="mail" class="h-5 w-5 text-white/50"></i>
                            </div>
                            <input type="email" id="email" required
                                   class="block w-full pl-11 pr-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:bg-white/20 transition-all"
                                   placeholder="you@example.com">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-white/90 mb-1.5" data-i18n="passLabel">รหัสผ่าน</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-lucide="lock" class="h-5 w-5 text-white/50"></i>
                            </div>
                            <input type="password" id="password" required
                                   class="block w-full pl-11 pr-12 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:bg-white/20 transition-all"
                                   placeholder="••••••••">
                            <button type="button" id="togglePass" class="absolute inset-y-0 right-0 pr-4 flex items-center text-white/40 hover:text-white/80 transition-colors">
                                <i data-lucide="eye" id="eyeIcon" class="h-5 w-5"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between mt-2">
                        <div class="flex items-center">
                            <input id="remember-me" type="checkbox" class="h-4 w-4 bg-white/10 border-white/30 rounded text-blue-500 focus:ring-blue-400 focus:ring-offset-gray-900">
                            <label for="remember-me" class="ml-2 block text-sm text-white/80" data-i18n="remember">จดจำฉันไว้</label>
                        </div>
                        <a href="#" class="text-sm font-medium text-blue-300 hover:text-blue-200 transition-colors" data-i18n="forgot">ลืมรหัสผ่าน?</a>
                    </div>

                    <button type="submit" id="submitBtn"
                            class="w-full flex justify-center items-center gap-2 py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-blue-500 transition-colors mt-6 disabled:opacity-70 disabled:cursor-not-allowed">
                        <span id="btnText" data-i18n="loginBtn">เข้าสู่ระบบ</span>
                        <i data-lucide="loader-2" id="loadingIcon" class="h-5 w-5 animate-spin hidden"></i>
                    </button>
                </form>

                <div class="mt-8 mb-6">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-white/20"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-3 bg-transparent text-white/60" data-i18n="or">หรือเข้าสู่ระบบด้วย</span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <button class="flex items-center justify-center gap-2 py-2.5 px-4 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl text-white text-sm font-medium transition-colors">
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Google
                    </button>
                    <button class="flex items-center justify-center gap-2 py-2.5 px-4 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl text-white text-sm font-medium transition-colors">
                        <svg class="h-5 w-5 text-blue-500" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                        Facebook
                    </button>
                </div>

                <p class="mt-8 text-center text-sm text-white/70">
                    <span data-i18n="noAcc">ยังไม่มีบัญชีใช่ไหม? </span>
                    <a href="Register.html" class="font-bold text-blue-300 hover:text-blue-200 transition-colors" data-i18n="regLink">สมัครสมาชิกฟรี</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // ========================================
        // ⚙️ CONFIG — ใส่ URL Apps Script ของคุณที่นี่
        // ========================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx9TbfDler6EqXCAXpEF6Zc-sK-jjTUgNu2crFKJ9JktboRRLUxtonPrYjPdkJfdYdiJA/exec'; // 🔴 อย่าลืมใส่ URL ตรงนี้นะครับ
        // ========================================

        // --- ระบบแปลภาษา ---
        const TRANSLATIONS = {
            TH: {
                pageTitle: 'เข้าสู่ระบบ | SouthVibes',
                back: 'กลับสู่หน้าหลัก',
                title: 'ยินดีต้อนรับกลับมา',
                subtitle: 'เข้าสู่ระบบเพื่อเริ่มวางแผนและแบ่งปันการเดินทางของคุณ',
                emailLabel: 'อีเมล',
                passLabel: 'รหัสผ่าน',
                remember: 'จดจำฉันไว้',
                forgot: 'ลืมรหัสผ่าน?',
                loginBtn: 'เข้าสู่ระบบ',
                or: 'หรือเข้าสู่ระบบด้วย',
                noAcc: 'ยังไม่มีบัญชีใช่ไหม? ',
                regLink: 'สมัครสมาชิกฟรี',
                loading: 'กำลังตรวจสอบ...',
                successMsg: '✅ เข้าสู่ระบบสำเร็จ! ยินดีต้อนรับ',
                failMsg: 'เข้าสู่ระบบล้มเหลว',
                errorMsg: 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้ง',
                configError: 'ยังไม่ได้ตั้งค่า SCRIPT_URL กรุณาใส่ URL ของ Apps Script'
            },
            EN: {
                pageTitle: 'Sign In | SouthVibes',
                back: 'Back to Home',
                title: 'Welcome Back',
                subtitle: 'Sign in to start planning and sharing your journey.',
                emailLabel: 'Email Address',
                passLabel: 'Password',
                remember: 'Remember me',
                forgot: 'Forgot password?',
                loginBtn: 'Sign In',
                or: 'Or sign in with',
                noAcc: "Don't have an account? ",
                regLink: 'Sign up for free',
                loading: 'Verifying...',
                successMsg: '✅ Login successful! Welcome.',
                failMsg: 'Login failed',
                errorMsg: 'Cannot connect to server. Please try again.',
                configError: 'SCRIPT_URL is not configured. Please add your Apps Script URL.'
            }
        };

        let currentLang = localStorage.getItem('southvibes_lang') || 'TH';

        function updateApp() {
            const t = TRANSLATIONS[currentLang];
            document.title = t.pageTitle;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (!t[key]) return;
                el.tagName === 'INPUT' ? el.placeholder = t[key] : el.textContent = t[key];
            });
            document.getElementById('btn-th').className = `hover:text-white transition-colors ${currentLang === 'TH' ? 'text-white font-bold' : 'text-white/50'}`;
            document.getElementById('btn-en').className = `hover:text-white transition-colors ${currentLang === 'EN' ? 'text-white font-bold' : 'text-white/50'}`;
        }

        document.getElementById('btn-th').addEventListener('click', () => { currentLang = 'TH'; localStorage.setItem('southvibes_lang', 'TH'); updateApp(); });
        document.getElementById('btn-en').addEventListener('click', () => { currentLang = 'EN'; localStorage.setItem('southvibes_lang', 'EN'); updateApp(); });

        // --- Toast Notification ---
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = msg;

            toast.className = toast.className
                .replace(/bg-\S+/g, '')
                .replace(/border-\S+/g, '')
                .trim();

            if (type === 'success') {
                toast.classList.add('bg-green-600/80', 'border-green-400/30');
                toastIcon.setAttribute('data-lucide', 'check-circle');
            } else {
                toast.classList.add('bg-red-600/80', 'border-red-400/30');
                toastIcon.setAttribute('data-lucide', 'x-circle');
            }

            lucide.createIcons();
            toast.classList.remove('hide');
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
                toast.classList.add('hide');
            }, 4000);
        }

        // --- Toggle Password Visibility ---
        document.getElementById('togglePass').addEventListener('click', function () {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        });

        // --- Login Form Submit ---
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const t = TRANSLATIONS[currentLang];

            if (!SCRIPT_URL || SCRIPT_URL.trim() === '') {
                showToast(t.configError, 'error');
                return;
            }

            const email = document.getElementById('email').value.trim();
            const passwordField = document.getElementById('password');
            const password = passwordField.value;
            const btnText = document.getElementById('btnText');
            const submitBtn = document.getElementById('submitBtn');

            // 🟢 เริ่มสถานะ Loading (ดึงไอคอนตรงๆ จาก DOM เพื่อแก้บั๊กไอคอนค้างตอนรีเฟรช Toast)
            btnText.textContent = t.loading;
            document.getElementById('loadingIcon').classList.remove('hidden');
            submitBtn.disabled = true;

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'login',
                        email: email,
                        password: password
                    })
                });
                
                const result = await response.json();

                if (result.success) {
                    if (document.getElementById('remember-me').checked) {
                        localStorage.setItem('sv_user_email', email);
                    } else {
                        localStorage.removeItem('sv_user_email');
                    }
                    
                    localStorage.setItem("loggedInUser", JSON.stringify(result.user));
                    showToast(result.message, 'success');
                    
                    setTimeout(() => { 
                        window.location.href = "index.html";
                    }, 1500);

                } else {
                    // ❌ กรณีล็อกอินไม่ผ่าน (รหัสผิด / อีเมลผิด)
                    showToast(`❌ ${result.message}`, 'error');
                    
                    passwordField.value = ''; // ล้างช่องรหัสผ่าน
                    
                    // 🟢 หยุดวงกลมหมุนและคืนค่าปุ่มให้กดใหม่ได้ (ดึงใหม่จาก DOM)
                    btnText.textContent = t.loginBtn;
                    document.getElementById('loadingIcon').classList.add('hidden');
                    submitBtn.disabled = false;
                }

            } catch (error) {
                console.error('Login error:', error);
                showToast(`เกิดข้อผิดพลาด: ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้`, 'error');
                
                passwordField.value = ''; // ล้างช่องรหัสผ่าน
                
                // 🟢 หยุดวงกลมหมุนและคืนค่าปุ่มให้กดใหม่ได้ (ดึงใหม่จาก DOM)
                btnText.textContent = t.loginBtn;
                document.getElementById('loadingIcon').classList.add('hidden');
                submitBtn.disabled = false;
            } 
        });

        // โหลดอีเมลที่จำไว้
        const savedEmail = localStorage.getItem('sv_user_email');
        if (savedEmail) {
            document.getElementById('email').value = savedEmail;
            document.getElementById('remember-me').checked = true;
        }

        updateApp();
    </script>
</body>
</html>
